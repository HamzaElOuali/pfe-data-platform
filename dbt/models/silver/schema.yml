version: 2

models:
  - name: stg_orders
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: order_status
        tests:
          - accepted_values:
              values: ['delivered', 'shipped', 'canceled', 'invoiced', 'processing', 'approved', 'unavailable', 'created']

  - name: stg_customers
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null

  - name: stg_products
    columns:
      - name: product_id
        tests:
          - unique
          - not_null

  - name: stg_order_items
    columns:
      - name: order_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
      - name: price
        tests:
          - dbt_utils.accepted_range:
              min_value: 0

  - name: stg_order_payments
    columns:
      - name: order_id
        tests:
          - not_null
      - name: payment_value
        tests:
          - dbt_utils.accepted_range:
              min_value: 0

  - name: stg_order_reviews
    columns:
      - name: review_id
        tests:
          - unique
          - not_null
      - name: review_score
        tests:
          - dbt_utils.accepted_range:
              min_value: 1
              max_value: 5

  - name: stg_sellers
    columns:
      - name: seller_id
        tests:
          - unique
          - not_null

  - name: stg_geolocation
    columns:
      - name: geolocation_zip_code_prefix
        tests:
          - unique
          - not_null

  - name: stg_category_translation
    columns:
      - name: product_category_name
        tests:
          - unique
          - not_null
